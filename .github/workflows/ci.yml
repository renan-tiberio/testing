name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Types, lint, format, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # lib/env.ts requires these at build time. CI makes no Supabase calls, so
      # placeholders are enough; Vercel builds with the real values.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      # No git hooks on CI runners.
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate
      - run: pnpm run build
